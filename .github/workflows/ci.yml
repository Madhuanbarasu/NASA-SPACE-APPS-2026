name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (sandbox kernels, synthetic terrain)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pinned Python packages
        run: python -m pip install -r backend/requirements.txt

      # Test kernels only (data/kernels_demo). Production NAIF kernels are never installed in CI,
      # so every result stays "Pending validation" and V-02e is skipped.
      # The backend job is the only one that saves this cache; demo-smoke only restores it.
      - name: Restore sandbox test kernels
        id: kcache
        uses: actions/cache@v5
        with:
          path: data/kernels_demo
          key: sandbox-kernels-${{ hashFiles('backend/lunaops/acquire.py') }}

      - name: Download sandbox test kernels
        if: steps.kcache.outputs.cache-hit != 'true'
        working-directory: backend
        run: python -m lunaops.acquire sandbox-kernels

      - name: Run pytest
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider -rs

      - name: Check the LOLA registry was not modified
        run: git diff --exit-code -- data/dem/registry.json

  frontend:
    name: Frontend build (tsc + vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  demo-smoke:
    name: Demo smoke test (start.py --demo)
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pinned Python packages
        run: python -m pip install -r backend/requirements.txt

      - uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Restore sandbox test kernels (restore only; saved by the backend job)
        uses: actions/cache/restore@v5
        with:
          path: data/kernels_demo
          key: sandbox-kernels-${{ hashFiles('backend/lunaops/acquire.py') }}

      - name: Start the demo and exercise it over HTTP
        run: python scripts/smoke_demo.py --port 8765

      - name: Check the LOLA registry was not modified
        run: git diff --exit-code -- data/dem/registry.json
